name: CI

permissions:
  contents: read

# CI 改为仅手动触发（workflow_dispatch），不在 push/PR 时自动运行，避免邮件打扰。
# 本地仍按 AGENTS.md 在提交前跑 typecheck + test + build（server: go test/vet/build；admin: typecheck/test/build）。
on:
  workflow_dispatch:

jobs:
  server:
    name: server (go test + linux build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum
      - name: Download deps
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build (Linux amd64, CGO off)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/apppilot-server .

  admin:
    name: admin (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
